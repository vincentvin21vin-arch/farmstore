<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | default: site.description }}">
  <meta name="google-site-verification" content="6jsTOtG13iieedPnkqojfbc9DaY8gqMzfh7vSsRJ1nw">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate:160 | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/foodstorelogo.png' | absolute_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.excerpt | strip_html | strip_newlines | truncate:160 | default: site.description }}">
  <meta name="twitter:image" content="{{ '/assets/img/foodstorelogo.png' | absolute_url }}">
  <meta name="twitter:creator" content="{{ site.twitter_username | default: '' }}">

  <!-- Icons -->
  <link rel="icon" href="{{ '/assets/img/foodstorelogo.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/foodstorelogo.png' | relative_url }}">

  <!-- JSON-LD Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "logo": "{{ '/assets/img/foodstorelogo.png' | absolute_url }}",
    "contactPoint": [{ "@type":"ContactPoint","email":"{{ site.email }}","contactType":"customer support"}]
  }
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-15DMJTT5R1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date());
    gtag('config', 'G-15DMJTT5R1');
  </script>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9544545496987230" crossorigin="anonymous"></script>
</head>
<body>
  {% include header.html %}
  <main class="container" role="main">
    {% unless page.layout == "post" or page.url == "/" %}
    <div class="site-ad" role="complementary" aria-label="Advertisement">
      <div class="site-ad__inner">
        <div class="site-ad__label">Advertisement</div>
        <div class="ad-container">
          <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-9544545496987230"
            data-ad-slot="3625027533"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </div>
    </div>
    {% endunless %}

    {{ content }}

    <div class="site-ad" role="complementary" aria-label="Advertisement">
      <div class="site-ad__inner">
        <div class="site-ad__label">Advertisement</div>
        <div class="ad-container">
          <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-9544545496987230"
            data-ad-slot="6333634707"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </div>
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
